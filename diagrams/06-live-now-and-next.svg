<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">One DGX Spark, one vCluster Standalone cluster, and two model client workloads</title>
  <desc id="desc">The existing Minima router and two resident model backends remain managed on the Spark host. vCluster Standalone adds a Kubernetes control plane and worker on the same machine. Two namespace-scoped Jobs call the host router through the Spark node IP.</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FF5A1F"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#070B26"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#070B26" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Virgil, "Comic Sans MS", "Segoe UI", sans-serif; fill: #070B26; }
      .subtitle { font: 18px Virgil, "Comic Sans MS", "Segoe UI", sans-serif; fill: #475569; }
      .heading { font: 700 22px Virgil, "Comic Sans MS", "Segoe UI", sans-serif; fill: #070B26; }
      .label { font: 700 18px Virgil, "Comic Sans MS", "Segoe UI", sans-serif; fill: #070B26; }
      .small { font: 15px Virgil, "Comic Sans MS", "Segoe UI", sans-serif; fill: #334155; }
      .micro { font: 13px Virgil, "Comic Sans MS", "Segoe UI", sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
      .orange { fill: #FF5A1F; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#FCFDFE"/>
  <text x="600" y="48" text-anchor="middle" class="title">One Spark, two tenant clusters, two model clients</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">Verified 16 Sep 2026: each team's own cluster reached Minima's host-managed API</text>

  <g filter="url(#shadow)">
    <rect x="38" y="112" width="1124" height="570" rx="28" fill="#FFFFFF" stroke="#070B26" stroke-width="3"/>
  </g>
  <rect x="38" y="112" width="1124" height="58" rx="28" fill="#070B26"/>
  <rect x="38" y="142" width="1124" height="28" fill="#070B26"/>
  <text x="600" y="149" text-anchor="middle" class="heading white">NVIDIA DGX SPARK · ONE LINUX HOST</text>

  <rect x="75" y="198" width="490" height="396" rx="22" fill="#E9F7F7" stroke="#168B91" stroke-width="3"/>
  <rect x="635" y="198" width="490" height="396" rx="22" fill="#FFF1E9" stroke="#FF5A1F" stroke-width="3"/>

  <rect x="95" y="218" width="280" height="32" rx="16" fill="#168B91"/>
  <text x="235" y="240" text-anchor="middle" class="small white">HOST-MANAGED MODEL PLANE</text>
  <text x="105" y="282" class="heading">Minima remains host-managed</text>
  <text x="105" y="310" class="small">No model restart · no repackaging · both models stayed resident</text>

  <rect x="105" y="335" width="430" height="76" rx="15" fill="#FFFFFF" stroke="#168B91" stroke-width="2"/>
  <text x="320" y="365" text-anchor="middle" class="label">OpenAI-compatible router :8000</text>
  <text x="320" y="392" text-anchor="middle" class="micro">listens on the Spark host · both models remain resident</text>

  <rect x="105" y="440" width="202" height="108" rx="15" fill="#FFF8F4" stroke="#FF5A1F" stroke-width="2"/>
  <text x="206" y="475" text-anchor="middle" class="label">Qwen 3.6 27B</text>
  <text x="206" y="503" text-anchor="middle" class="small">text · reasoning · tools</text>
  <text x="206" y="530" text-anchor="middle" class="micro">loopback backend :8867</text>

  <rect x="333" y="440" width="202" height="108" rx="15" fill="#F7F7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="434" y="475" text-anchor="middle" class="label">Gemma 4 31B</text>
  <text x="434" y="503" text-anchor="middle" class="small">text · vision · tools</text>
  <text x="434" y="530" text-anchor="middle" class="micro">loopback backend :8868</text>

  <rect x="665" y="218" width="235" height="32" rx="16" fill="#FF5A1F"/>
  <text x="782" y="240" text-anchor="middle" class="small white">vCluster Standalone</text>
  <text x="665" y="282" class="heading">Standalone = Control Plane Cluster</text>
  <text x="665" y="310" class="small">Two tenant clusters, one per team</text>

  <rect x="665" y="335" width="430" height="76" rx="15" fill="#FFFFFF" stroke="#FF5A1F" stroke-width="2"/>
  <text x="880" y="365" text-anchor="middle" class="label">Standalone control plane binary</text>
  <text x="880" y="392" text-anchor="middle" class="micro">Kubernetes v1.36.0 · the Spark is its only node</text>

  <rect x="665" y="440" width="202" height="108" rx="15" fill="#FFFFFF" stroke="#FF5A1F" stroke-width="2"/>
  <text x="766" y="474" text-anchor="middle" class="label">team-qwen</text>
  <text x="766" y="503" text-anchor="middle" class="small">tenant cluster · own API</text>
  <text x="766" y="530" text-anchor="middle" class="micro">HTTP client → router :8000</text>

  <rect x="893" y="440" width="202" height="108" rx="15" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <text x="994" y="474" text-anchor="middle" class="label">team-gemma</text>
  <text x="994" y="503" text-anchor="middle" class="small">tenant cluster · own API</text>
  <text x="994" y="530" text-anchor="middle" class="micro">HTTP client → router :8000</text>

  <path d="M766 440 L766 424 L620 424" fill="none" stroke="#070B26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M994 440 L994 424 L620 424" fill="none" stroke="#070B26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M620 424 C590 424 578 373 536 373" fill="none" stroke="#070B26" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
  <text x="602" y="453" text-anchor="middle" class="micro">BOTH TEAMS</text>
  <text x="602" y="472" text-anchor="middle" class="micro">HTTP :8000</text>

  <rect x="75" y="618" width="232" height="38" rx="19" fill="#070B26"/>
  <text x="191" y="643" text-anchor="middle" class="micro white">TWO TENANT CLUSTERS</text>
  <rect x="315" y="618" width="195" height="38" rx="19" fill="#E9F7F7" stroke="#168B91" stroke-width="2"/>
  <text x="412" y="643" text-anchor="middle" class="micro">SPARK = ONLY NODE</text>
  <rect x="518" y="618" width="242" height="38" rx="19" fill="#FFF1E9" stroke="#FF5A1F" stroke-width="2"/>
  <text x="639" y="643" text-anchor="middle" class="micro">OWN API ≠ OWN HARDWARE</text>
  <rect x="768" y="618" width="142" height="38" rx="19" fill="#F7F7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="839" y="643" text-anchor="middle" class="micro">REBUILT IN 24s</text>
  <rect x="918" y="618" width="207" height="38" rx="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="1021" y="643" text-anchor="middle" class="micro">TAILSCALE VERIFIED</text>

  <text x="600" y="706" text-anchor="middle" class="micro">EACH TEAM GETS ITS OWN KUBERNETES API · SHARED GPU, NOT HARDWARE ISOLATION</text>
  <text x="600" y="734" text-anchor="middle" class="label orange">MINIMA RUNS THE MODELS · vCluster STANDALONE RUNS THE KUBERNETES CLIENT WORKLOADS</text>
</svg>
