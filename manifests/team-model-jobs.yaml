apiVersion: v1
kind: Namespace
metadata:
  name: team-qwen
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-gemma
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ask-qwen
  namespace: team-qwen
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ask-qwen
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: client
          image: curlimages/curl:8.12.1
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command: ["/bin/sh", "-ec"]
          args:
            - |
              curl --fail-with-body -sS --connect-timeout 10 --max-time 180 \
                "http://${HOST_IP}:8000/v1/chat/completions" \
                -H 'Content-Type: application/json' \
                -d '{
                  "model": "qwen3.6-27b",
                  "messages": [{
                    "role": "user",
                    "content": "Reply with exactly: hello from team-qwen"
                  }],
                  "temperature": 0,
                  "max_tokens": 32,
                  "chat_template_kwargs": {"enable_thinking": false}
                }'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            # curlimages/curl declares the named user `curl_user`; Kubernetes
            # needs its numeric identity to enforce runAsNonRoot.
            runAsUser: 101
            runAsGroup: 102
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ask-gemma
  namespace: team-gemma
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ask-gemma
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: client
          image: curlimages/curl:8.12.1
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command: ["/bin/sh", "-ec"]
          args:
            - |
              curl --fail-with-body -sS --connect-timeout 10 --max-time 180 \
                "http://${HOST_IP}:8000/v1/chat/completions" \
                -H 'Content-Type: application/json' \
                -d '{
                  "model": "gemma4-31b-it",
                  "messages": [{
                    "role": "user",
                    "content": "Reply with exactly: hello from team-gemma"
                  }],
                  "temperature": 0,
                  "max_tokens": 32
                }'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            seccompProfile:
              type: RuntimeDefault
